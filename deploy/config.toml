# Настройки nohands. bootstrap кладёт этот файл в ~/.config/nohands/config.toml,
# если там ещё ничего нет; дальше правьте тот, что в ~/.config.

[shell.llm]
# LLM переводит фразы-намерения в режиме консоли («покажи файлы в загрузках»).
# backend = "none" — только правила, без LLM.
# url — адрес ollama, по умолчанию "http://localhost:11434". Не ставьте сюда
# другую машину без нужды: фраза, текущий каталог терминала и до 50 имён
# файлов из него уйдут туда по HTTP, без шифрования.
model = "qwen2.5-coder:7b"
# Слоёв модели на видеокарте, остальное на CPU. Подобрано под 6 ГБ: 7b целиком
# не влезает вместе с whisper, 20 из 28 — ~0.75 с на фразу, 22 — предел.
# Под свою карту: скажите в консоли фразу-намерение, чтобы модель загрузилась,
# и посмотрите nvidia-smi — whisper medium держит ~1.1 ГБ, 20 слоёв 7b ~3.4 ГБ,
# каждый слой ~0.15 ГБ. Прибавляйте, пока свободно больше ~300 МБ (запас на
# рабочий стол и браузер); ollama ps покажет долю CPU/GPU. Без NVIDIA число
# ни на что не влияет. Это потолок: если видеопамять занял браузер, демон
# перед загрузкой возьмёт меньше слоёв, чтобы осталось место whisper, — в
# журнале будет «на видеокарте N слоёв из 20». Уберите строку — раскладку
# выберет ollama (медленнее), и тогда её никто не ограничит.
num_gpu = 20

[head]
# Камера для слежения за головой: номер (0 — /dev/video0) или путь. На
# ноутбуке с внешней камерой нулевой бывает встроенная. Надёжнее путь из
# ls /dev/v4l/by-id/ — он не меняется при перестановке камер между портами
# USB; берите тот, что оканчивается на index0. Если номер не открылся,
# демон сам берёт первую камеру оттуда и пишет в журнал, какую.
camera = 0
# Ручная выдержка камеры: короткая держит 23 кадра в секунду там, где
# автоэкспозиция при тусклом свете падает до 15, — курсор от головы плавнее.
# Единицы у каждой камеры свои. Кадр слишком тёмный и лицо теряется —
# прибавьте, частота упала — убавьте; её видно в журнале строкой
# «голова: выключено, N FPS».
exposure = 400

[mouse]
# Шаг «мышь выше», «мышь левее» и соседей — один символ терминала, пикселей
# [ширина, высота]. 8x18 — Ubuntu Sans Mono 11 без масштаба; при другом
# шрифте или масштабе экрана шаг промахивается мимо соседней буквы.
char_px = [8, 18]

[whisper]
# Модель диктовки и консоли. device = "auto" берёт видеокарту NVIDIA, если
# она есть, иначе процессор; "cuda" или "cpu" — принудительно. Без model:
# medium на видеокарте (~0.8 с на фразу), small на процессоре (~1.6 с на
# 12 потоках; medium там же думает 4.7 с). Другие: base (быстрее, ошибается
# чаще), large-v3 (точнее, вдвое медленнее medium). После смены модели
# запустите bootstrap.sh ещё раз — он её скачает, иначе это сделает первая
# диктовка.
device = "auto"

[log]
# Писать ли в журнал сказанное и вставленное текстом. Выключено: туда попадает
# всё, что диктовали, вплоть до паролей. Для отладки распознавания включите
# и перезапустите службу (nohands restart); без этого в журнале только длина.
text = false
